<!DOCTYPE html>

<body class="bg-[#0b0c10] text-white">

  <div class=""></div>

      <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
        <a href="#">Home</a>

        <a href="#">Careers</a>

        <div class="absolute w-72 h-72 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <img src="../robot area (1).png" alt="AI Robot with Shield" class="w-full max-w-[450px] h-auto object-contain relative z-10 drop-shadow-[0_35px_35px_rgba(29,78,216,0.15)]">

    </div>
